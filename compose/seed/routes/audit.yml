# Generated by plat5 routes generate from plat5.yml's kinds. Edit it like any
# routes file; generating again overwrites it.
audit:
  url: http://audit:3002
  routes:
    - path: /orgs/{organization}/audit-events
      scope: organization
      upstream: /nodes/{subject.organization_id}/audit-events
      methods: [GET]
      required_labels: ['organization:audit:read']
    - path: /orgs/{organization}/projects/{project}/audit-events
      scope: project
      upstream: /nodes/{subject.project_id}/audit-events
      methods: [GET]
      required_labels: ['project:audit:read']
    - path: /me/audit-events
      scope: directory
      upstream: /members/{subject.member_id}/audit-events
      methods: [GET]
