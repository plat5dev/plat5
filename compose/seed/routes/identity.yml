# Generated by plat5 routes generate from plat5.yml's kinds. Edit it like any
# routes file; generating again overwrites it.
identity:
  url: http://identity:3000
  routes:
    - path: /orgs
      scope: directory
      upstream: /roots/organization
      methods: [POST]
    - path: /orgs/{organization}
      scope: organization
      upstream: /nodes/{subject.organization_id}
      methods:
        GET:
          required_labels: ['organization:read']
        PATCH:
          required_labels: ['organization:write']
        DELETE:
          required_labels: ['organization:delete']
    - path: /orgs/{organization}/restore
      scope: organization
      upstream: /nodes/{subject.organization_id}/restore
      methods: [POST]
      required_labels: ['organization:delete']
      resolve_deleted: true
    - path: /orgs/{organization}/bindings
      scope: organization
      upstream: /nodes/{subject.organization_id}/bindings
      methods:
        GET:
          required_labels: ['organization:bindings:read']
        POST:
          required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/bindings/{binding_id}
      scope: organization
      upstream: /nodes/{subject.organization_id}/bindings/{path.binding_id}
      methods: [PATCH, DELETE]
      required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/access
      scope: organization
      upstream: /nodes/{subject.organization_id}/access
      methods: [GET]
      required_labels: ['organization:bindings:read']
    - path: /orgs/{organization}/service-accounts
      scope: organization
      upstream: /nodes/{subject.organization_id}/service-accounts
      methods:
        GET:
          required_labels: ['organization:bindings:read']
        POST:
          required_labels: ['organization:service-accounts:write']
    - path: /orgs/{organization}/service-accounts/{service_account}
      scope: organization
      upstream: /nodes/{subject.organization_id}/service-accounts/{path.service_account}
      methods:
        GET:
          required_labels: ['organization:bindings:read']
        PATCH:
          required_labels: ['organization:service-accounts:write']
        DELETE:
          required_labels: ['organization:service-accounts:write']
    - path: /orgs/{organization}/service-accounts/{service_account}/keys
      scope: organization
      upstream: /nodes/{subject.organization_id}/service-accounts/{path.service_account}/keys
      methods: [GET, POST]
      required_labels: ['organization:service-accounts:write']
    - path: /orgs/{organization}/service-accounts/{service_account}/keys/{key_id}
      scope: organization
      upstream: /nodes/{subject.organization_id}/service-accounts/{path.service_account}/keys/{path.key_id}
      methods: [DELETE]
      required_labels: ['organization:service-accounts:write']
    - path: /orgs/{organization}/invites
      scope: organization
      upstream: /nodes/{subject.organization_id}/invites
      methods: [GET, POST]
      required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/invites/{invite_id}
      scope: organization
      upstream: /nodes/{subject.organization_id}/invites/{path.invite_id}
      methods: [DELETE]
      required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/roles
      scope: organization
      upstream: /nodes/{subject.organization_id}/roles
      methods: [GET]
      required_labels: []
    - path: /orgs/{organization}/members
      scope: organization
      upstream: /nodes/{subject.organization_id}/members
      methods:
        GET:
          required_labels: ['organization:bindings:read']
        POST:
          required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/members/{member}
      scope: organization
      upstream: /nodes/{subject.organization_id}/members/{path.member}
      methods:
        GET:
          required_labels: []
        DELETE:
          required_labels: ['organization:bindings:write']
    - path: /orgs/{organization}/me
      scope: organization
      upstream: /nodes/{subject.organization_id}/members/{subject.member_id}
      methods: [DELETE]
      required_labels: []
    - path: /orgs/{organization}/projects
      scope: organization
      upstream: /nodes/{subject.organization_id}/children/project
      methods:
        GET:
          required_labels: []
        POST:
          required_labels: ['project:create']
    - path: /orgs/{organization}/projects/{project}
      scope: project
      upstream: /nodes/{subject.project_id}
      methods:
        GET:
          required_labels: ['project:read']
        PATCH:
          required_labels: ['project:write']
        DELETE:
          required_labels: ['project:delete']
    - path: /orgs/{organization}/projects/{project}/restore
      scope: project
      upstream: /nodes/{subject.project_id}/restore
      methods: [POST]
      required_labels: ['project:delete']
      resolve_deleted: true
    - path: /orgs/{organization}/projects/{project}/bindings
      scope: project
      upstream: /nodes/{subject.project_id}/bindings
      methods:
        GET:
          required_labels: ['project:bindings:read']
        POST:
          required_labels: ['project:bindings:write']
    - path: /orgs/{organization}/projects/{project}/bindings/{binding_id}
      scope: project
      upstream: /nodes/{subject.project_id}/bindings/{path.binding_id}
      methods: [PATCH, DELETE]
      required_labels: ['project:bindings:write']
    - path: /orgs/{organization}/projects/{project}/access
      scope: project
      upstream: /nodes/{subject.project_id}/access
      methods: [GET]
      required_labels: ['project:bindings:read']
    - path: /orgs/{organization}/projects/{project}/service-accounts
      scope: project
      upstream: /nodes/{subject.project_id}/service-accounts
      methods:
        GET:
          required_labels: ['project:bindings:read']
        POST:
          required_labels: ['project:service-accounts:write']
    - path: /orgs/{organization}/projects/{project}/service-accounts/{service_account}
      scope: project
      upstream: /nodes/{subject.project_id}/service-accounts/{path.service_account}
      methods:
        GET:
          required_labels: ['project:bindings:read']
        PATCH:
          required_labels: ['project:service-accounts:write']
        DELETE:
          required_labels: ['project:service-accounts:write']
    - path: /orgs/{organization}/projects/{project}/service-accounts/{service_account}/keys
      scope: project
      upstream: /nodes/{subject.project_id}/service-accounts/{path.service_account}/keys
      methods: [GET, POST]
      required_labels: ['project:service-accounts:write']
    - path: /orgs/{organization}/projects/{project}/service-accounts/{service_account}/keys/{key_id}
      scope: project
      upstream: /nodes/{subject.project_id}/service-accounts/{path.service_account}/keys/{path.key_id}
      methods: [DELETE]
      required_labels: ['project:service-accounts:write']
    - path: /orgs/{organization}/projects/{project}/invites
      scope: project
      upstream: /nodes/{subject.project_id}/invites
      methods: [GET, POST]
      required_labels: ['organization:guests:write']
    - path: /orgs/{organization}/projects/{project}/invites/{invite_id}
      scope: project
      upstream: /nodes/{subject.project_id}/invites/{path.invite_id}
      methods: [DELETE]
      required_labels: ['organization:guests:write']
    - path: /orgs/{organization}/projects/{project}/roles
      scope: project
      upstream: /nodes/{subject.project_id}/roles
      methods: [GET]
      required_labels: []
    - path: /me
      scope: directory
      upstream: /members/{subject.member_id}
      methods: [GET, DELETE]
    - path: /me/nodes
      scope: directory
      upstream: /members/{subject.member_id}/nodes
      methods: [GET]
    - path: /me/keys
      scope: directory
      upstream: /members/{subject.member_id}/keys
      methods: [GET, POST]
    - path: /me/keys/{key_id}
      scope: directory
      upstream: /members/{subject.member_id}/keys/{path.key_id}
      methods: [DELETE]
    - path: /me/invites/redeem
      scope: directory
      upstream: /members/{subject.member_id}/invites/redeem
      methods: [POST]
