# Starter roles for this deployment (docs/roles.md). Plat5 names no roles:
# these are yours to rename, add to, or replace. Identity reads this file at
# boot (ROLES_FILE); restart identity after editing it.
#
# A role grants labels. Routes require labels (required_scopes). ["*"] grants
# every label. The org:* labels match the identity catalog
# (services/identity/routes.yml); add your own services' labels here.
roles:
  owner: ["*"]
  admin: [org:write, org:members:write, org:service-accounts:write]
  member: []
creator_role: owner
default_role: member
