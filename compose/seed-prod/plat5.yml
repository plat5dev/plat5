# First-boot config for a deployment (docs/guides/deploy.md): kinds and roles,
# so identity can start, and no services. Edit it before first boot; after that
# it's never read again. Keep your config in a repo and change it with
# plat5 plan and plat5 apply, which add the routes files.
deletion_grace: 30d
reserved_slugs: [new, settings, api, admin]
kinds:
  directory:
    sign_in: idp
    name_claim: name
  organization:
    label: Organization
    segment: orgs
  project:
    label: Project
    parent: organization
roles:
  owner:
    labels: ["*"]
    bindable_at: [organization, project]
  admin:
    labels: [organization:read, organization:write, organization:bindings:read, organization:bindings:write,
             organization:service-accounts:write, organization:audit:read, project:create, project:read]
    bindable_at: [organization]
  member:
    labels: [organization:read]
    bindable_at: [organization]
  developer:
    labels: [project:read, project:write, project:service-accounts:write, project:bindings:read]
    bindable_at: [organization, project]
default_role: member
creator_role: owner
services: []
