# Image-mode production stack. PLAT5_VERSION comes from the env file.
# Local source build:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.build.yml --env-file .env up --build -d
name: plat5

volumes:
  pg_data:

networks:
  plat5:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plat5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plat5}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      service.name: valkey
      service.namespace: infra
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  control-plane:
    image: ghcr.io/plat5dev/control-plane:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: control-plane
      service.namespace: edge
      metrics.port: "5003"
    # Admin API not published by default in prod — reach via private network.
    environment:
      PORT: 5002
      INTERNAL_PORT: 5003
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      IDENTITY_INTERNAL_URL: http://identity:3001
      # seed-prod/plat5.yml is applied once on first boot. After that, change the
      # config with plat5 apply (docs/guides/deploy.md); editing it does nothing.
      SEED_DIR: /seed
      RUST_LOG: info
      OTEL_SERVICE_NAME: control-plane
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: prod
    volumes:
      - ./seed-prod:/seed:ro
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway:
    image: ghcr.io/plat5dev/gateway:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      INTERNAL_PORT: 8000
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:-}
      AUTH_USER_ID_CLAIM: ${AUTH_USER_ID_CLAIM:-properties.user_id}
      CREDENTIAL_VALIDATE_URL: http://identity:3001/internal/credentials/validate
      # Audit is on unless AUDIT_ENABLED=false (then audit need not run).
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_URL: http://audit:3003
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      RUST_LOG: info
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: ${RATE_LIMIT_AUTH_FAILURE_REQUESTS:-60}
      RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      VALKEY_URL: redis://valkey:6379
      # Routes and CORS origins (docs/control-plane.md).
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: gateway
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: prod
    networks:
      - plat5
    depends_on:
      valkey:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      identity:
        condition: service_started
      audit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  identity:
    image: ghcr.io/plat5dev/identity:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      APIKEY_BRAND: ${APIKEY_BRAND:-plat5}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      # Roles come from the control plane; change them with PUT /roles.
      # ROLES_ENABLED=false turns roles off: every member holds every label.
      ROLES_ENABLED: ${ROLES_ENABLED:-true}
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: identity
      OTEL_SERVICE_NAMESPACE: identity
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: prod
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  audit:
    image: ghcr.io/plat5dev/audit:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: audit
      service.namespace: audit
      metrics.port: "3003"
    environment:
      PORT: 3002
      INTERNAL_PORT: 3003
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      OTEL_SERVICE_NAME: audit
      OTEL_SERVICE_NAMESPACE: audit
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: prod
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
