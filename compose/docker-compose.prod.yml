# Image-mode production stack. PLAT5_VERSION comes from the env file.
# Local source build:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.build.yml --env-file .env up --build -d
name: plat5

volumes:
  pg_data:

networks:
  plat5:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plat5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plat5}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      service.name: valkey
      service.namespace: infra
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  control-plane:
    image: ghcr.io/plat5dev/control-plane:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: control-plane
      service.namespace: edge
      metrics.port: "5003"
    # Admin API not published by default in prod — reach via private network.
    environment:
      PORT: 5002
      INTERNAL_PORT: 5003
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DATABASE_URL: postgres://${POSTGRES_USER:-plat5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      IDENTITY_INTERNAL_URL: http://identity:3001
      RUST_LOG: info
      OTEL_SERVICE_NAME: control-plane
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=edge,deployment.environment=prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway:
    image: ghcr.io/plat5dev/gateway:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      INTERNAL_PORT: 8000
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:?set AUTH_ALLOWED_AUDIENCES}
      AUTH_SUBJECT_CLAIM: ${AUTH_SUBJECT_CLAIM:-sub}
      AUTH_NAME_CLAIMS: ${AUTH_NAME_CLAIMS:-name,preferred_username}
      AUTH_SCOPE_CLAIM: ${AUTH_SCOPE_CLAIM:-}
      IDENTITY_INTERNAL_URL: http://identity:3001
      ADMIT_CACHE_TTL: ${ADMIT_CACHE_TTL:-5m}
      ADMIT_NEGATIVE_CACHE_TTL: ${ADMIT_NEGATIVE_CACHE_TTL:-10s}
      # Audit is sync by default; set AUDIT_MODE=off to disable (then audit need not run).
      AUDIT_MODE: ${AUDIT_MODE:-sync}
      AUDIT_URL: http://audit:3003
      # Rate limiting is on unless RATE_LIMIT_ENABLED=false (then valkey need not run).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      VALKEY_URL: redis://valkey:6379
      VALKEY_KEY_PREFIX: ${VALKEY_KEY_PREFIX:-}
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: ${RATE_LIMIT_AUTH_FAILURE_REQUESTS:-60}
      RATE_LIMIT_AUTH_FAILURE_WINDOW: ${RATE_LIMIT_AUTH_FAILURE_WINDOW:-60s}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      UPSTREAM_SIGNING_KEY: ${UPSTREAM_SIGNING_KEY:-}
      UPSTREAM_SIGNING_KEY_ID: ${UPSTREAM_SIGNING_KEY_ID:-}
      UPSTREAM_BLOCK_PRIVATE_IPS: ${UPSTREAM_BLOCK_PRIVATE_IPS:-}
      RUST_LOG: info
      # Kinds, routes, rate limits and CORS (docs/reference/gateway.md#control-plane).
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: gateway
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=edge,deployment.environment=prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - plat5
    depends_on:
      valkey:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      identity:
        condition: service_started
      audit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  identity:
    image: ghcr.io/plat5dev/identity:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      SECRET_BRAND: ${SECRET_BRAND:-plat5}
      DATABASE_URL: postgres://${POSTGRES_USER:-plat5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      CONTROL_PLANE_URL: http://control-plane:5003
      UPSTREAM_BLOCK_PRIVATE_IPS: ${UPSTREAM_BLOCK_PRIVATE_IPS:-}
      OTEL_SERVICE_NAME: identity
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=identity,deployment.environment=prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  audit:
    image: ghcr.io/plat5dev/audit:${PLAT5_VERSION:?set PLAT5_VERSION}
    labels:
      service.name: audit
      service.namespace: audit
      metrics.port: "3003"
    environment:
      PORT: 3002
      INTERNAL_PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-plat5}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plat5}?sslmode=disable
      OTEL_SERVICE_NAME: audit
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=audit,deployment.environment=prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
