name: plat5

volumes:
  etcd_data:
  pg_data:

networks:
  plat5:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plat5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plat5}
      POSTGRES_DB: ${POSTGRES_DB:-plat5}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.0
    labels:
      service.name: etcd
      service.namespace: infra
    environment:
      ETCD_NAME: etcd0
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
      ETCD_INITIAL_CLUSTER_STATE: new
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
    volumes:
      - etcd_data:/etcd-data
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    labels:
      service.name: redis
      service.namespace: infra
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  route-registry:
    build:
      context: ../services/route-registry
      target: local
    # cargo-watch as PID 1 ignores SIGTERM; tini forwards stop signals.
    init: true
    labels:
      service.name: route-registry
      service.namespace: edge
      metrics.port: "5003"
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      INTERNAL_PORT: 5003
      ETCD_URL: http://etcd:2379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      SEED_ROUTES_DIR: /seed
      RUST_LOG: info
      OTEL_SERVICE_NAME: route-registry
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/route-registry/src:/app/src
      - ../services/route-registry/migrations:/app/migrations:ro
      - ../services/identity/routes.yml:/seed/identity.yml:ro
    networks:
      - plat5
    depends_on:
      etcd:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  gateway:
    build:
      context: ../services/gateway
      target: local
    # cargo-watch as PID 1 ignores SIGTERM; tini forwards stop signals.
    init: true
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      INTERNAL_PORT: 8000
      # Any IdP via host/public URL — do not join the IdP Docker network.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:5000}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://host.docker.internal:5000/.well-known/jwks.json}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:-plat5}
      AUTH_USER_ID_CLAIM: ${AUTH_USER_ID_CLAIM:-properties.user_id}
      USER_APIKEY_VALIDATE_URL: http://identity:3001/internal/user-keys/validate
      MEMBER_APIKEY_VALIDATE_URL: http://identity:3001/internal/member-keys/validate
      MEMBER_RESOLVE_URL: http://identity:3001/internal/members/resolve
      APIKEY_BRAND: ${APIKEY_BRAND:-plat5}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      RUST_LOG: info
      APIKEY_CACHE_TTL_SECS: "300"
      MEMBER_CACHE_TTL_SECS: "300"
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: ${RATE_LIMIT_AUTH_FAILURE_REQUESTS:-60}
      RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS:-60}
      REDIS_URL: redis://redis:6379
      ETCD_URL: http://etcd:2379
      OTEL_SERVICE_NAME: gateway
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/gateway/src:/app/src
    networks:
      - plat5
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      route-registry:
        condition: service_healthy
      identity:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  identity:
    build:
      context: ../services/identity
      target: local
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      APIKEY_BRAND: ${APIKEY_BRAND:-plat5}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      OTEL_SERVICE_NAME: identity
      OTEL_SERVICE_NAMESPACE: identity
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/identity:/app
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
