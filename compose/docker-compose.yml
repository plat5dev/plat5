name: plat5

volumes:
  pg_data:

networks:
  plat5:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plat5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plat5}
      POSTGRES_DB: ${POSTGRES_DB:-plat5}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      service.name: valkey
      service.namespace: infra
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  control-plane:
    build:
      context: ../services/control-plane
      additional_contexts:
        schema: ../schema/v2
      target: local
    # cargo-watch as PID 1 ignores SIGTERM; tini forwards stop signals.
    init: true
    labels:
      service.name: control-plane
      service.namespace: edge
      metrics.port: "5003"
    ports:
      - "5402:5002"
    environment:
      PORT: 5002
      INTERNAL_PORT: 5003
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      IDENTITY_INTERNAL_URL: http://identity:3001
      # plat5.yml and its routes files, applied once on first boot
      # (docs/reference/api/control-plane.md#seeds).
      SEED_DIR: /seed
      RUST_LOG: info
      OTEL_SERVICE_NAME: control-plane
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/control-plane/src:/app/src
      - ../services/control-plane/migrations:/app/migrations:ro
      - ../schema/v2:/schema/v2:ro
      - ./seed:/seed:ro
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  gateway:
    build:
      context: ../services/gateway
      target: local
    # cargo-watch as PID 1 ignores SIGTERM; tini forwards stop signals.
    init: true
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "5400:5001"
    environment:
      PORT: 5001
      INTERNAL_PORT: 8000
      # Any IdP via host/public URL — do not join the IdP Docker network.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:5401}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://host.docker.internal:5401/.well-known/jwks.json}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:-plat5}
      AUTH_USER_ID_CLAIM: ${AUTH_USER_ID_CLAIM:-properties.user_id}
      CREDENTIAL_VALIDATE_URL: http://identity:3001/internal/credentials/validate
      # Audit is on unless AUDIT_ENABLED=false (then audit need not run).
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_URL: http://audit:3003
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      RUST_LOG: info
      APIKEY_CACHE_TTL_SECS: "300"
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: ${RATE_LIMIT_AUTH_FAILURE_REQUESTS:-60}
      RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      VALKEY_URL: redis://valkey:6379
      # Routes and CORS origins (docs/control-plane.md).
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: gateway
      OTEL_SERVICE_NAMESPACE: edge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/gateway/src:/app/src
    networks:
      - plat5
    depends_on:
      valkey:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      identity:
        condition: service_started
      audit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  identity:
    build:
      context: ../services/identity
      target: local
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      PORT: 3000
      INTERNAL_PORT: 3001
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      APIKEY_BRAND: ${APIKEY_BRAND:-plat5}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: identity
      OTEL_SERVICE_NAMESPACE: identity
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/identity:/app
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  audit:
    build:
      context: ../services/audit
      target: local
    labels:
      service.name: audit
      service.namespace: audit
      metrics.port: "3003"
    environment:
      PORT: 3002
      INTERNAL_PORT: 3003
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      OTEL_SERVICE_NAME: audit
      OTEL_SERVICE_NAMESPACE: audit
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEPLOYMENT_ENV: docker
    volumes:
      - ../services/audit:/app
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
