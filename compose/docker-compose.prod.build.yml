# Optional override: build images from this repo instead of pulling GHCR.
# docker compose -f docker-compose.prod.yml -f docker-compose.prod.build.yml --env-file .env up --build -d
services:
  control-plane:
    build:
      context: ../services/control-plane
      additional_contexts:
        schema: ../schema/v2
      target: prod
      args:
        VERSION: ${PLAT5_VERSION:?set PLAT5_VERSION}
        REVISION: ${PLAT5_REVISION:-}
  gateway:
    build:
      context: ../services/gateway
      additional_contexts:
        schema: ../schema/v2
      target: prod
      args:
        VERSION: ${PLAT5_VERSION:?set PLAT5_VERSION}
        REVISION: ${PLAT5_REVISION:-}
  identity:
    build:
      context: ../services/identity
      target: prod
      args:
        VERSION: ${PLAT5_VERSION:?set PLAT5_VERSION}
        REVISION: ${PLAT5_REVISION:-}
  audit:
    build:
      context: ../services/audit
      target: prod
      args:
        VERSION: ${PLAT5_VERSION:?set PLAT5_VERSION}
        REVISION: ${PLAT5_REVISION:-}
