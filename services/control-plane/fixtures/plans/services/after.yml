kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
creator_role: admin
rate_limits:
  default: { requests: 60, window_seconds: 60 }
services:
  e10s:
    url: http://e10s:4000
    timeouts: { connect: 2s, read: 60s }
    max_body_bytes: 1048576
    scopes:
      organization:
        upstream_prefix: /orgs/{organization.id}
        routes:
          - path: /plans
            methods:
              GET: { required_permissions: [organization:read] }
      project:
        upstream_prefix: /projects/{project.id}
        routes:
          - path: /plans
            methods:
              GET: { required_permissions: [project:read, catalog:read] }
              POST: { required_permissions: [catalog:write] }
          - path: /features
            required_permissions: [catalog:write]
            methods: [GET, POST]
  notify:
    url: http://notify:3000
    scopes:
      user:
        routes:
          - path: /user/notifications
            upstream: /users/{user.id}/notifications
            methods: [GET, PUT]
