# A route under a child kind's collection.
kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
creator_role: admin
services:
  e10s:
    url: http://e10s:3000
    scopes:
      organization:
        upstream_prefix: /orgs/{organization.id}
        routes:
          - path: /projects/archived
            required_permissions: [organization:read]
            methods: [GET]
