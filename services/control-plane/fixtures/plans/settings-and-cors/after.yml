deletion_grace: 7d
reserved_slugs: [new, settings]
defaults:
  rate_limit: [standard]
  timeouts: { connect: 5s, read: 20s }
  max_body_bytes: 2097152
rate_limits:
  standard: { requests: 120, window: 60s }
  evals-org: { requests: 300, window: 1s, count_at: organization }
kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
creator_role: admin
services:
  e10s:
    url: http://e10s:3000
    scopes:
      organization:
        upstream_prefix: /orgs/{organization.id}
        routes:
          - path: /plans
            methods:
              GET: { permissions: [organization:read], rate_limit: [evals-org] }
      project:
        upstream_prefix: /projects/{project.id}
        routes:
          - path: /plans
            methods:
              GET: { permissions: [project:read] }
              POST: { permissions: [catalog:write] }
      public:
        routes:
          - path: /health
            methods: [GET]
