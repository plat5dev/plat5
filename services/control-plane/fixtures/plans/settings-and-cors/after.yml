deletion_grace: 7d
reserved_slugs: [new, settings]
users:
  name:
    claims: [profile.display_name, nickname]
    sync: each_sign_in
defaults:
  timeouts: { connect: 5s, read: 20s }
  max_body_bytes: 2097152
rate_limits:
  default: { requests: 120, window_seconds: 60 }
  evals-org: { requests: 300, window_seconds: 1, count_at: organization }
cors:
  allowed_origins: ["https://app.example.com"]
  allowed_headers: [idempotency-key]
kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
creator_role: admin
services:
  e10s:
    url: http://e10s:3000
    scopes:
      organization:
        upstream_prefix: /orgs/{organization.id}
        routes:
          - path: /plans
            methods:
              GET: { required_permissions: [organization:read], rate_limit: [evals-org] }
      project:
        upstream_prefix: /projects/{project.id}
        routes:
          - path: /plans
            methods:
              GET: { required_permissions: [project:read] }
              POST: { required_permissions: [catalog:write] }
      public:
        routes:
          - path: /health
            methods: [GET]
