kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
  folder:
    parent: organization
    path: /folders/{folder}
    list_permission: folder:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project, folder]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
  developer:
    includes: [member]
    permissions: [project:read]
    bindable_at: [organization, project]
creator_role: admin
defaults:
  rate_limit: [standard]
rate_limits:
  standard: { requests: 60, window: 60s }
services:
  identity:
    url: http://identity:3000
    scopes:
      organization:
        upstream_prefix: /nodes/{organization.id}
        routes:
          - path: /
            methods:
              GET: { permissions: [organization:read] }
              PATCH: { permissions: [organization:write] }
              DELETE: { permissions: [organization:delete] }
          - path: /restore
            allow_deleted: true
            methods:
              POST: { permissions: [organization:delete] }
          - path: /projects
            upstream: /nodes/{organization.id}/children/project
            methods:
              GET: { permissions: any_member }
              POST: { permissions: [project:create] }
          - path: /folders
            upstream: /nodes/{organization.id}/children/folder
            methods:
              GET: { permissions: any_member }
              POST: { permissions: [folder:create] }
          - path: /membership
            upstream: /nodes/{organization.id}/memberships/{member.id}
            methods:
              GET: { permissions: any_member }
              DELETE: { permissions: any_member }
          - path: /bindings
            methods:
              GET: { permissions: [organization:bindings:read] }
              POST: { permissions: [organization:bindings:write] }
          - path: /bindings/{binding_id}
            methods:
              PATCH: { permissions: [organization:bindings:write] }
              DELETE: { permissions: [organization:bindings:write] }
          - path: /service-accounts
            methods:
              GET: { permissions: [organization:bindings:read] }
              POST: { permissions: [organization:bindings:write] }
          - path: /service-accounts/{service_account_id}
            methods:
              GET: { permissions: [organization:bindings:read] }
              PATCH: { permissions: [organization:bindings:write] }
              DELETE: { permissions: [organization:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys
            methods:
              GET: { permissions: [organization:bindings:write] }
              POST: { permissions: [organization:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys/{key_id}
            methods:
              DELETE: { permissions: [organization:bindings:write] }
          - path: /invites
            methods:
              GET: { permissions: [organization:bindings:write] }
              POST: { permissions: [organization:bindings:write] }
          - path: /invites/{invite_id}
            methods:
              DELETE: { permissions: [organization:bindings:write] }
          - path: /roles
            methods:
              GET: { permissions: any_member }
          - path: /members
            methods:
              GET: { permissions: [organization:bindings:read] }
          - path: /members/{member_id}
            methods:
              GET: { permissions: any_member }
              DELETE: { permissions: [organization:bindings:write] }
      project:
        upstream_prefix: /nodes/{project.id}
        routes:
          - path: /
            methods:
              GET: { permissions: [project:read] }
              PATCH: { permissions: [project:write] }
              DELETE: { permissions: [project:delete] }
          - path: /restore
            allow_deleted: true
            methods:
              POST: { permissions: [project:delete] }
          - path: /membership
            upstream: /nodes/{project.id}/memberships/{member.id}
            methods:
              GET: { permissions: any_member }
          - path: /bindings
            methods:
              GET: { permissions: [project:bindings:read] }
              POST: { permissions: [project:bindings:write] }
          - path: /bindings/{binding_id}
            methods:
              PATCH: { permissions: [project:bindings:write] }
              DELETE: { permissions: [project:bindings:write] }
          - path: /service-accounts
            methods:
              GET: { permissions: [project:bindings:read] }
              POST: { permissions: [project:bindings:write] }
          - path: /service-accounts/{service_account_id}
            methods:
              GET: { permissions: [project:bindings:read] }
              PATCH: { permissions: [project:bindings:write] }
              DELETE: { permissions: [project:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys
            methods:
              GET: { permissions: [project:bindings:write] }
              POST: { permissions: [project:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys/{key_id}
            methods:
              DELETE: { permissions: [project:bindings:write] }
          - path: /invites
            methods:
              GET: { permissions: [guests:write] }
              POST: { permissions: [guests:write] }
          - path: /invites/{invite_id}
            methods:
              DELETE: { permissions: [guests:write] }
          - path: /roles
            methods:
              GET: { permissions: any_member }
      folder:
        upstream_prefix: /nodes/{folder.id}
        routes:
          - path: /
            methods:
              GET: { permissions: [folder:read] }
              PATCH: { permissions: [folder:write] }
              DELETE: { permissions: [folder:delete] }
          - path: /restore
            allow_deleted: true
            methods:
              POST: { permissions: [folder:delete] }
          - path: /membership
            upstream: /nodes/{folder.id}/memberships/{member.id}
            methods:
              GET: { permissions: any_member }
          - path: /bindings
            methods:
              GET: { permissions: [folder:bindings:read] }
              POST: { permissions: [folder:bindings:write] }
          - path: /bindings/{binding_id}
            methods:
              PATCH: { permissions: [folder:bindings:write] }
              DELETE: { permissions: [folder:bindings:write] }
          - path: /service-accounts
            methods:
              GET: { permissions: [folder:bindings:read] }
              POST: { permissions: [folder:bindings:write] }
          - path: /service-accounts/{service_account_id}
            methods:
              GET: { permissions: [folder:bindings:read] }
              PATCH: { permissions: [folder:bindings:write] }
              DELETE: { permissions: [folder:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys
            methods:
              GET: { permissions: [folder:bindings:write] }
              POST: { permissions: [folder:bindings:write] }
          - path: /service-accounts/{service_account_id}/keys/{key_id}
            methods:
              DELETE: { permissions: [folder:bindings:write] }
          - path: /invites
            methods:
              GET: { permissions: [guests:write] }
              POST: { permissions: [guests:write] }
          - path: /invites/{invite_id}
            methods:
              DELETE: { permissions: [guests:write] }
          - path: /roles
            methods:
              GET: { permissions: any_member }
      user:
        routes:
          - path: /orgs
            upstream: /roots/organization
            methods: [POST]
          - path: /user
            upstream: /users/{user.id}
            methods: [GET, PATCH, DELETE]
          - path: /user/nodes
            upstream: /users/{user.id}/nodes
            methods: [GET]
          - path: /user/keys
            upstream: /users/{user.id}/keys
            methods: [GET, POST]
          - path: /user/keys/{key_id}
            upstream: /users/{user.id}/keys/{key_id}
            methods: [DELETE]
          - path: /user/invites/redeem
            upstream: /users/{user.id}/invites/redeem
            methods: [POST]
