kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
  folder:
    parent: organization
    path: /folders/{folder}
    list_permission: folder:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project, folder]
  member:
    permissions: [organization:read]
    bindable_at: [organization]
  developer:
    includes: [member]
    permissions: [project:read]
    bindable_at: [organization, project]
creator_role: admin
rate_limits:
  default: { requests: 60, window_seconds: 60 }
services:
  identity:
    url: http://identity:3000
