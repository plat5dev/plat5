version: 2
kinds:
  directory:
    sign_in: idp
  organization:
    label: Organization
    segment: orgs
    parent: account
  project:
    label: Project
    parent: organization
  account:
    label: Account
roles:
  admin:
    labels: ["*"]
    bindable_at: [account, organization, project]
  member:
    labels: ["organization:read"]
    bindable_at: [account, organization]
default_role: member
creator_role: admin
services:
  e10s:
    url: "http://e10s:3000"
    routes:
      - path: "/health"
        scope: public
        methods: [GET]
