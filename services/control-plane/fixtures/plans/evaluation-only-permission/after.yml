# A role grants a permission no route requires: one checked only through
# identity's evaluation API. Accepted.
kinds:
  organization:
    path: /orgs/{organization}
    list_permission: organization:read
  project:
    parent: organization
    path: /projects/{project}
    list_permission: project:read
roles:
  admin:
    permissions: ["*"]
    bindable_at: [organization, project]
  member:
    permissions: [organization:read, catalog:delete]
    bindable_at: [organization]
creator_role: admin
defaults:
  rate_limit: [standard]
rate_limits:
  standard: { requests: 60, window_seconds: 60 }
services:
  e10s:
    url: http://e10s:3000
    scopes:
      project:
        upstream_prefix: /projects/{project.id}
        routes:
          - path: /plans
            required_permissions: [project:read]
            methods: [GET, POST]
