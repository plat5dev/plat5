[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
blake3 = "1.5"
bytes = "1"
etcd-client = "0.14"
http = "1.1.0"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto"] }
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1.19.0"
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-http = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
pingora = { version = "0.6", features = ["proxy"] }
prometheus = { version = "0.13.4", features = ["process"] }
regex = "1.10.3"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
