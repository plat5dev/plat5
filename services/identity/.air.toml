root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ."
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true
  time = false

[misc]
  clean_on_exit = true
