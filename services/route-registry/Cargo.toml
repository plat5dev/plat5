[package]
name = "route-registry"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "route-registry"
path = "src/main.rs"

[dependencies]
axum = "0.8"
etcd-client = "0.14"
http = "1"
once_cell = "1.19"
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"] }
prometheus = { version = "0.13.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
