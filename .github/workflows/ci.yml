name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      control-plane: ${{ steps.filter.outputs.control-plane }}
      identity: ${{ steps.filter.outputs.identity }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - '.github/workflows/ci.yml'
              - 'services/gateway/**'
            control-plane:
              - '.github/workflows/ci.yml'
              - 'services/control-plane/**'
            identity:
              - '.github/workflows/ci.yml'
              - 'services/identity/**'
            audit:
              - '.github/workflows/ci.yml'
              - 'services/audit/**'

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/gateway
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  control-plane:
    needs: changes
    if: needs.changes.outputs.control-plane == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/control-plane
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/identity/go.mod
          cache-dependency-path: services/identity/go.sum
      - name: format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audit
    # The append-only rules are SQL. Store tests run against Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/audit/go.mod
          cache-dependency-path: services/audit/go.sum
      - name: format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # Single required check for branch protection. Skipped jobs count as ok.
  ci:
    needs:
      - changes
      - gateway
      - control-plane
      - identity
      - audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.gateway.result }}"
            "${{ needs.control-plane.result }}"
            "${{ needs.identity.result }}"
            "${{ needs.audit.result }}"
          )
          for r in "${results[@]}"; do
            case "$r" in
              failure|cancelled) echo "job result: $r"; exit 1 ;;
            esac
          done
          echo "ok"
