name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: plat5dev

jobs:
  # Native multi-arch: amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm (no QEMU).
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: services/gateway
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: gateway
            context: services/gateway
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: route-registry
            context: services/route-registry
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: route-registry
            context: services/route-registry
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: identity
            context: services/identity
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: identity
            context: services/identity
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-${{ matrix.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name:
          - gateway
          - route-registry
          - identity
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
